<title>משחק לי בראש</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Press+Start+2P&display=swap">
<style>
  :root{color-scheme:dark;--bg:#150c2b;--ink:#f4ecff;--pink:#ff4f9a;--cyan:#3fe0ff}
  body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif}
  .wrap{direction:rtl;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 36px;display:grid;gap:16px}
  h1{margin:0;font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05}
  h1 span{color:var(--pink)}
  .stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px var(--cyan),0 0 40px rgba(63,224,255,.35)}
  canvas{display:block;width:100%;aspect-ratio:4/5;max-width:100%;background:#000}
  .big{position:absolute;inset:0;margin:auto;width:120px;height:120px;border-radius:50%;border:4px solid #fff;background:var(--pink);color:#fff;font-size:44px;cursor:pointer;box-shadow:0 0 30px var(--pink)}
  .big:focus-visible,.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  .row{display:flex;gap:12px;align-items:center}
  .btn{font-family:"Press Start 2P",monospace;font-size:12px;padding:12px 16px;background:var(--cyan);color:#150c2b;border:0;border-radius:10px;cursor:pointer}
  .bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
  .fill{height:100%;width:0;background:var(--pink)}
</style>
<div class="wrap">
  <h1>רועי <span>משחק לי בראש</span></h1>
  <div class="stage">
    <canvas id="stage" aria-label="אנימציה: רועי נכנס דרך צוהר במצח ומשחק פינבול במוח"></canvas>
    <button class="big" id="big" aria-label="נגן">▶</button>
  </div>
  <div class="row"><button class="btn" id="play">PLAY</button><div class="bar"><div class="fill" id="fill"></div></div></div>
</div>
<script>
(() => {
const W=1080,H=1350,PANEL=760,END=20;
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p, seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, eout=p=>1-Math.pow(1-p,3);
const back=p=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const pulse=(t,at,d)=>{const p=(t-at)/d;return p<0||p>1?0:Math.sin(p*Math.PI);};
const decay=(t,at,d)=>{const p=(t-at)/d;return p<0||p>1?0:1-p;};
const blink=(t,arr)=>Math.max(0,...arr.map(b=>pulse(t,b,.2)));
function srand(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
const FONT_HE='"Rubik", "Arial Hebrew", sans-serif', FONT_PX='"Press Start 2P", monospace';

/* ============ PINBALL DATA ============ */
const BUMP=[{x:300,y:250,c:'#ff4f9a',w:'קפה'},{x:560,y:170,c:'#3fe0ff',w:'דדליין'},{x:800,y:290,c:'#ffd23f',w:'מה לפרסם?'},{x:540,y:405,c:'#7dff6a',w:'רעיון!'}];
const BR=62, BALLR=17, FL={x:385,y:585}, FR={x:695,y:585}, FLEN=138;
const RAW=[[9.0,'p',905,640],[9.35,'p',905,110],[9.6,'b',1],[9.95,'b',0],[10.35,'b',3],[10.8,'fl'],[11.15,'b',2],[11.5,'b',1],[11.9,'fr'],[12.2,'b',0],[12.5,'b',3],[12.8,'b',2],[13.2,'fl'],[13.5,'b',1],[13.8,'b',0],[14.1,'b',3],[14.4,'b',2],[14.75,'fr'],[15.05,'b',1],[15.3,'b',3],[15.55,'b',0],[15.8,'b',2],[16.05,'b',1],[16.3,'b',3],[16.6,'fl'],[16.8,'b',3],[17.0,'stuck']];
const PATH=[], HITS=[];
for(const r of RAW){
  const [t,type]=r; let x,y;
  if(type==='p'){ x=r[2]; y=r[3]; }
  else if(type==='b'){ const c=BUMP[r[2]], pr=PATH[PATH.length-1]; let dx=pr.x-c.x, dy=pr.y-c.y; const L=Math.hypot(dx,dy)||1; x=c.x+dx/L*(BR+BALLR); y=c.y+dy/L*(BR+BALLR); HITS.push({t,type,i:r[2]}); }
  else if(type==='fl'){ x=470; y=556; HITS.push({t,type}); }
  else if(type==='fr'){ x=610; y=556; HITS.push({t,type}); }
  else { x=BUMP[3].x; y=BUMP[3].y+BR+BALLR; }
  PATH.push({t,x,y});
}
function ballPos(t){
  if(t<=PATH[0].t) return PATH[0];
  for(let i=0;i<PATH.length-1;i++){ const a=PATH[i],b=PATH[i+1]; if(t<b.t){ const p=(t-a.t)/(b.t-a.t); return {x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p)-Math.sin(p*Math.PI)*18}; } }
  return PATH[PATH.length-1];
}
function lastHit(t,filter){ let h=null; for(const x of HITS){ if(x.t<=t && (!filter||filter(x))) h=x; } return h; }
function flipK(t,type){ let k=0; for(const h of HITS){ if(h.type!==type) continue; const p=(t-h.t+.06)/.26; if(p>=0&&p<=1) k=Math.max(k,p<.3?p/.3:1-(p-.3)/.7); } return k; }

/* ============ AUDIO ============ */
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
const EV=[]; const add=(t,fn,...a)=>EV.push({t,fn,a});
[[0.15,52],[0.53,55],[0.9,56],[1.28,57],[1.65,58],[2.03,59]].forEach(([t,m])=>{ add(t,'pluck',m,.25,.33); add(t,'pluck',m-12,.25,.22); });
for(let k=0;k<8;k++) add(0.15+k*.375,'hat',.05);
add(2.05,'bell',88,.9,.22); add(2.12,'bell',95,.9,.16);
add(3.0,'pad',[52,55,59],5.9,.045);
add(3.41,'knock',.9); add(3.91,'knock',.9);
add(4.3,'whoosh',.5,.3); [64,67,71,76,79,83,88].forEach((m,i)=>add(4.3+i*.045,'sq',m,.12,.11));
add(4.72,'slide',300,900,.25,.16);
add(5.45,'poofs',.45);
add(6.3,'slide',500,1500,.7,.14); add(7.0,'slide',1500,380,.6,.14);
[91,95,98,100,103].forEach((m,i)=>add(7.6+i*.06,'bell',m,.35,.11));
add(8.3,'clunk',.8);
for(let x=0;x<14;x++) add(8.3+x*.05,'snare',.1+x*.035);
const S8=.4, T0=9.0;
const LEAD=[76,null,79,83,81,79,78,79, 76,null,71,76,78,79,81,83, 84,null,83,81,79,81,83,79, 81,null,79,78,74,76,78,75, 76,76,88,null,76,76,88,null];
LEAD.forEach((m,i)=>{ if(m) add(T0+i*S8/2,'sq',m,S8/2*.85,.12); });
const ROOT=[40,40,36,38,40];
for(let i=0;i<40;i++){ const r=ROOT[Math.floor(i/8)]; add(T0+i*S8/2,'tri',r+(i%2?12:0),S8/2*.9,.34); }
for(let b=0;b<20;b++){ const tt=T0+b*S8; add(tt,'hat',.07); add(tt+S8/2,'hat',.05); if(b%2==0) add(tt,'kick',.9); else add(tt,'snare',.42); }
add(T0,'crash',.4); add(T0+16*S8,'crash',.3);
HITS.forEach(h=>{ if(h.type==='b'){ const m=[88,91,93,95][h.i]; add(h.t,'bell',m,.25,.15); add(h.t,'sq',m-12,.08,.09); } else add(h.t,'flip',.55); });
add(17.0,'buzz',.75,.3);
add(17.86,'poofs',.5); add(17.86,'slide',400,1300,.25,.16); add(18.0,'slide',1300,300,.6,.14);
add(18.6,'kick',1); add(18.62,'knock',.6);
[100,103,100].forEach((m,i)=>add(18.9+i*.22,'bell',m,.15,.09));
add(19.35,'clunk',.7);
add(19.55,'sq',71,.12,.13); add(19.7,'sq',76,.3,.13); add(19.7,'tri',40,.4,.34);
EV.sort((a,b)=>a.t-b.t);

let ac=null, master=null, gBus=null, noiseBuf=null;
function initAudio(){ ac=new (window.AudioContext||window.webkitAudioContext)(); noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
function newRun(){ master=ac.createGain(); master.gain.value=.8; const comp=ac.createDynamicsCompressor(); comp.threshold.value=-12; master.connect(comp); comp.connect(ac.destination); gBus=master; }
function killRun(){ if(!master) return; const m=master; m.gain.setTargetAtTime(0,ac.currentTime,.03); setTimeout(()=>{try{m.disconnect()}catch(e){}},400); master=null; }
function env(g,t,a,peak,hold,rel){ g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+Math.max(0,hold)); g.gain.exponentialRampToValueAtTime(.0001,t+a+Math.max(0,hold)+rel); }
function osc(type,f,t,end,dest,det=0){ const o=ac.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=det; o.connect(dest); o.start(t); o.stop(end); return o; }
function noise(t,dur,dest){ const n=ac.createBufferSource(); n.buffer=noiseBuf; n.connect(dest); n.start(t,Math.random()*.5); n.stop(t+dur); return n; }
function filt(type,f,dest,q){ const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q) b.Q.value=q; b.connect(dest); return b; }
function G(dest){ const g=ac.createGain(); g.connect(dest||master); return g; }
const INST={
  pluck(t,m,d,v){ const g=G(); const dec=Math.max(.18,d*1.3); env(g,t,.004,v,0,dec); const lp=filt('lowpass',2400,g); osc('triangle',mtof(m),t,t+dec+.1,lp); },
  sq(t,m,d,v){ const g=G(); env(g,t,.004,v,d,.05); osc('square',mtof(m),t,t+d+.1,filt('lowpass',4200,g)); },
  tri(t,m,d,v){ const g=G(); env(g,t,.004,v,d,.04); osc('triangle',mtof(m),t,t+d+.1,g); },
  bell(t,m,d,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); osc('sine',mtof(m),t,t+d+.05,g); const g2=G(); g2.gain.setValueAtTime(v*.3,t); g2.gain.exponentialRampToValueAtTime(.0001,t+d*.6); osc('sine',mtof(m)*2.01,t,t+d,g2); },
  pad(t,ns,d,v){ const g=G(); env(g,t,.4,v,Math.max(0,d-.4),.6); const lp=filt('lowpass',1300,g); for(const n of ns){ osc('sawtooth',mtof(n),t,t+d+.7,lp,-9); osc('sawtooth',mtof(n),t,t+d+.7,lp,9); } },
  knock(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.13); const o=osc('sine',820,t,t+.15,g); o.frequency.exponentialRampToValueAtTime(480,t+.06); const g2=G(); g2.gain.setValueAtTime(v*.4,t); g2.gain.exponentialRampToValueAtTime(.001,t+.03); noise(t,.04,filt('highpass',2000,g2)); },
  slide(t,f1,f2,d,v){ const g=G(); env(g,t,.02,v,d-.04,.06); const o=osc('sine',f1,t,t+d+.1,g); o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d); },
  whoosh(t,d,v){ const g=G(); env(g,t,d*.4,v,0,d*.6); const bp=filt('bandpass',300,g,1.2); bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(5000,t+d); noise(t,d+.05,bp); },
  poofs(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); noise(t,.45,filt('lowpass',1400,g)); },
  clunk(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.22); const o=osc('sine',140,t,t+.25,g); o.frequency.exponentialRampToValueAtTime(55,t+.15); const g2=G(); g2.gain.setValueAtTime(v*.5,t); g2.gain.exponentialRampToValueAtTime(.001,t+.07); noise(t,.08,filt('lowpass',900,g2)); },
  flip(t,v){ const g=G(); g.gain.setValueAtTime(v*.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.035); noise(t,.04,filt('highpass',3000,g)); const g2=G(); g2.gain.setValueAtTime(v,t); g2.gain.exponentialRampToValueAtTime(.001,t+.12); osc('sine',95,t,t+.13,g2); },
  buzz(t,d,v){ const g=G(); env(g,t,.01,v,d,.08); const lp=filt('lowpass',1300,g); osc('square',110,t,t+d+.1,lp); osc('square',116.5,t,t+d+.1,lp); },
  kick(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); const o=osc('sine',150,t,t+.32,g); o.frequency.exponentialRampToValueAtTime(45,t+.1); },
  snare(t,v){ const g=G(); g.gain.setValueAtTime(v*.8,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); noise(t,.16,filt('highpass',1500,g)); },
  hat(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.04); noise(t,.05,filt('highpass',8000,g)); },
  crash(t,v){ const g=G(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+1.5); noise(t,1.6,filt('highpass',5000,g)); },
};

/* ============ BACKGROUND ============ */
function makeBg(){
  const c1=document.createElement('canvas'); c1.width=W; c1.height=H; const c=c1.getContext('2d');
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#dfe3e6'); g.addColorStop(1,'#c9c4be'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const sky=c.createLinearGradient(0,0,0,760); sky.addColorStop(0,'#a9cdea'); sky.addColorStop(1,'#d6e7f3'); c.fillStyle=sky; c.fillRect(0,0,W,760);
  for(const [x,y,w] of [[30,230,190],[250,120,150],[430,270,120],[590,80,200],[830,190,180]]){
    const tg=c.createLinearGradient(x,0,x+w,0); tg.addColorStop(0,'#f6f7f9'); tg.addColorStop(1,'#c9d1d9'); c.fillStyle=tg; c.fillRect(x,y,w,760-y);
    c.fillStyle='rgba(80,105,130,.22)'; for(let yy=y+22;yy<740;yy+=34) for(let xx=x+14;xx<x+w-20;xx+=30) c.fillRect(xx,yy,16,18);
  }
  c.fillStyle='rgba(255,255,255,.22)'; c.fillRect(0,0,W,760);
  c.fillStyle='#484b50'; for(const x of [0,360,720,1080]) c.fillRect(x-7,0,14,770); c.fillRect(0,372,W,12); c.fillRect(0,748,W,20);
  const dg=c.createLinearGradient(0,768,0,H); dg.addColorStop(0,'#c2976a'); dg.addColorStop(1,'#8f6844'); c.fillStyle=dg; c.fillRect(0,768,W,H-768);
  c.fillStyle='rgba(255,255,255,.7)'; c.fillRect(620,30,420,10);
  const c2=document.createElement('canvas'); c2.width=W; c2.height=H; const d=c2.getContext('2d');
  try{ d.filter='blur(7px)'; }catch(e){}
  d.drawImage(c1,0,0); d.filter='none';
  d.fillStyle='rgba(20,10,40,.08)'; d.fillRect(0,0,W,H);
  return c2;
}
let BG=null;
function bgFull(){ ctx.drawImage(BG,0,0,W,H); }
function bgClose(){ ctx.drawImage(BG,160,80,760,950,0,0,W,H); }

/* ============ DANA ============ */
const FRECK=(()=>{ const r=srand(11); const a=[]; for(let i=0;i<16;i++) a.push([(r()-.5)*52,-4+r()*34]); for(let i=0;i<26;i++){ const s=i%2?1:-1; a.push([s*(36+r()*52),12+r()*44]); } return a; })();
function hairGrad(){ const hg=ctx.createLinearGradient(0,-240,0,430); hg.addColorStop(0,'#3a2213'); hg.addColorStop(.42,'#6c4426'); hg.addColorStop(1,'#bd8a55'); return hg; }
function danaEye(x,y,side,e){
  const w=e.wide||0, rx=31, ry=19*(1+w*.3);
  const top=()=>{ ctx.moveTo(x-rx,y); ctx.quadraticCurveTo(x,y-ry*1.7,x+rx,y); };
  ctx.save(); ctx.beginPath(); top(); ctx.quadraticCurveTo(x,y+ry*1.35,x-rx,y); ctx.closePath();
  ctx.fillStyle='#fbf7f2'; ctx.fill(); ctx.clip();
  let lx=e.look?e.look[0]:0, ly=e.look?e.look[1]:0; if(e.cross) lx+=-side*e.cross*10;
  const ix=x+lx, iy=y+ly+2;
  if(e.spin){ spiral(ix,iy,19,(e.t||0)*10*side,'#5a4320'); }
  else{
    const ig=ctx.createRadialGradient(ix-3,iy-3,2,ix,iy,18); ig.addColorStop(0,'#b3ad62'); ig.addColorStop(.5,'#71803f'); ig.addColorStop(1,'#5a3f22');
    ctx.fillStyle=ig; ctx.beginPath(); ctx.arc(ix,iy,18,0,7); ctx.fill();
    ctx.fillStyle='#1c120c'; ctx.beginPath(); ctx.arc(ix,iy,7.5*(1-w*.4),0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ix-6,iy-6,5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(ix+5,iy+5,2.2,0,7); ctx.fill();
  }
  ctx.restore();
  const lid=clamp(e.lids||0), cy=lerp(y-ry*1.7,y+ry*1.35,lid);
  if(lid>0.01){ ctx.fillStyle='#ecc09e'; ctx.beginPath(); top(); ctx.quadraticCurveTo(x,cy,x-rx,y); ctx.fill(); }
  ctx.strokeStyle='#24150d'; ctx.lineCap='round'; ctx.lineWidth=5.5;
  ctx.beginPath(); ctx.moveTo(x-rx,y); ctx.quadraticCurveTo(x,lid>0.01?cy:y-ry*1.7,x+rx,y); ctx.stroke();
  ctx.lineWidth=3; for(const k of [0,1]){ const bx=x+side*rx, by=y-2-k*6; ctx.beginPath(); ctx.moveTo(bx-side*6,by); ctx.lineTo(bx+side*9,by-8-k*3); ctx.stroke(); }
  ctx.strokeStyle='rgba(60,35,20,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-rx+4,y+2); ctx.quadraticCurveTo(x,y+ry*1.3,x+rx-4,y+2); ctx.stroke();
}
function spiral(x,y,r,rot,col){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.strokeStyle=col; ctx.lineWidth=3.2; ctx.beginPath(); for(let a=0;a<Math.PI*6;a+=.18){ const rr=r*a/(Math.PI*6); ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.stroke(); ctx.restore(); }
function danaMouth(m){
  ctx.save(); ctx.translate(0,90); ctx.lineCap='round'; ctx.lineJoin='round';
  if(m==='pout'){
    ctx.fillStyle='#d27b72'; ctx.beginPath(); ctx.moveTo(-34,-2); ctx.quadraticCurveTo(-17,-11,0,-5); ctx.quadraticCurveTo(17,-11,34,-2); ctx.quadraticCurveTo(0,4,-34,-2); ctx.fill();
    ctx.fillStyle='#df8d84'; ctx.beginPath(); ctx.moveTo(-31,-1); ctx.quadraticCurveTo(0,25,31,-1); ctx.quadraticCurveTo(0,6,-31,-1); ctx.fill();
    ctx.strokeStyle='#a9574f'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-34,-2); ctx.quadraticCurveTo(0,5,34,-2); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(6,10,7,3,0,0,7); ctx.fill();
  } else if(m==='smile'){
    ctx.fillStyle='#7a2d2d'; ctx.beginPath(); ctx.moveTo(-40,-6); ctx.quadraticCurveTo(0,4,40,-8); ctx.quadraticCurveTo(0,40,-40,-6); ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(-40,-10,80,12); ctx.restore();
    ctx.strokeStyle='#d27b72'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-40,-6); ctx.quadraticCurveTo(0,4,40,-8); ctx.quadraticCurveTo(0,40,-40,-6); ctx.stroke();
  } else if(m==='o'){
    ctx.fillStyle='#6e2626'; ctx.beginPath(); ctx.ellipse(0,6,12,16,0,0,7); ctx.fill(); ctx.strokeStyle='#d27b72'; ctx.lineWidth=7; ctx.stroke();
  } else if(m==='grit'){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(-34,-8,68,20,8); ctx.fill(); ctx.strokeStyle='#c56d64'; ctx.lineWidth=6; ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=2; for(const x of [-17,0,17]){ ctx.beginPath(); ctx.moveTo(x,-7); ctx.lineTo(x,11); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(-33,2); ctx.lineTo(33,2); ctx.stroke();
  } else if(m==='smirk'){
    ctx.strokeStyle='#c56d64'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(-30,2); ctx.quadraticCurveTo(2,8,34,-10); ctx.stroke();
    ctx.strokeStyle='#e08f86'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-22,7); ctx.quadraticCurveTo(4,17,26,-2); ctx.stroke();
    ctx.strokeStyle='rgba(160,95,65,.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(42,-14,6,-.3,1.4); ctx.stroke();
  }
  ctx.restore();
}
function hatch(x,y,r,o,col,glow){

/* ============ PLAYER ============ */
let playing=false,t0=0,idx=0,timer=null,pos=0,perf0=0,rafOn=false,sleepT=null;
const big=document.getElementById('big'), btn=document.getElementById('play'), fillEl=document.getElementById('fill');
function now(){ if(!playing) return pos; return ac?ac.currentTime-t0:(performance.now()-perf0)/1000; }
function kick(){ if(!rafOn){ rafOn=true; requestAnimationFrame(loop); } }
function play(from=0){ try{ if(!ac) initAudio(); clearTimeout(sleepT); ac.resume(); }catch(e){ ac=null; }
  if(ac){ killRun(); newRun(); t0=ac.currentTime+.08-from; } else perf0=performance.now()-from*1000;
  idx=EV.findIndex(e=>e.t>=from); if(idx<0) idx=EV.length; playing=true; clearInterval(timer); timer=setInterval(tick,40); tick(); big.hidden=true; btn.textContent='STOP'; kick(); }
function stop(end){ pos=end?END:now(); playing=false; clearInterval(timer); if(ac){ killRun(); sleepT=setTimeout(()=>{ if(!playing) ac.suspend(); },600); } btn.textContent=end?'AGAIN':'PLAY'; if(end){ big.hidden=false; big.textContent='↺'; } kick(); }
function tick(){ const n=now(); if(ac&&master){ while(idx<EV.length&&EV[idx].t<n+.2){ const e=EV[idx++]; INST[e.fn](Math.max(ac.currentTime,t0+e.t),...e.a); } } if(n>=END) stop(true); }

btn.addEventListener('click',()=>{ if(playing) stop(false); else play(pos>=END-.1?0:pos); });

function loop(){ const t=playing?now():pos; if(playing) started=true; draw(started?Math.min(t,END-.001):12.25); fillEl.style.width=(clamp(t/END)*100)+'%'; if(playing) requestAnimationFrame(loop); else rafOn=false; }
