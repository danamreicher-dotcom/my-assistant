<title>One More Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&family=Caveat:wght@600&display=swap">
<style>
  :root{--paper:#f4f0e6;--ink:#2f2c27}
  body{background:var(--paper);color:var(--ink);font-family:"Lora",Georgia,serif}
  .wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:24px 36px;display:grid;gap:14px}
  h1{margin:0;font-style:italic;font-weight:500;font-size:28px}
  .stage{position:relative;border-radius:18px;overflow:hidden;border:1.5px solid var(--ink)}
  canvas{display:block;width:100%;aspect-ratio:9/16;max-width:100%;background:var(--paper)}
  .big{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-size:34px;cursor:pointer}
  .big:disabled{opacity:.5;cursor:wait}
  .big:focus-visible,.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
  .row{display:flex;gap:12px;align-items:center}
  .btn{font-family:inherit;font-style:italic;font-size:16px;padding:8px 18px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;cursor:pointer}
  .bar{flex:1;height:4px;background:rgba(47,44,39,.15)} .fill{height:100%;width:0;background:#d9774e}
</style>
<div class="wrap">
  <h1>One more day</h1>
  <div class="stage"><canvas id="stage" aria-label="Hand-drawn animation: a 90-year-old spends one day at 25, and color appears wherever she pays attention"></canvas><button class="big" id="big" aria-label="Play" disabled>▶</button></div>
  <div class="row"><button class="btn" id="play" disabled>play</button><div class="bar"><div class="fill" id="fill"></div></div></div>
</div>
<script src="samples.js"></script>
<script>
(() => {
const W=1080,H=1920,END=43;
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
const cc=document.createElement('canvas'), cx=cc.getContext('2d'), mc=document.createElement('canvas'), mx=mc.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p, seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, eout=p=>1-Math.pow(1-p,3);
const pulse=(t,at,d)=>{const p=(t-at)/d;return p<0||p>1?0:Math.sin(p*Math.PI);};
const PAPER='#f4f0e6', INK='#2f2c27';
/* ================= AUDIO ================= */
const EV=[]; const add=(t,fn,...a)=>EV.push({t,fn,a});
[[.3,65],[1.5,72],[2.7,69],[3.9,65]].forEach(([t,m])=>add(t,'piano',m,1.6,.28));
[53,60,69].forEach((m,i)=>add(5.3+i*.06,'piano',m,2,.2)); add(5.4,'cel',89,1,.22); add(5.8,'cel',93,1,.18);
const CH=[[7.2,[41,48,53,57,60]],[9.6,[40,48,52,55,60]],[12.0,[38,45,50,53,57]],[14.4,[46,53,58,62,65]],[16.8,[45,53,57,60,65]],[19.2,[43,50,55,58,62]],[21.6,[48,52,55,60,64]],[24.0,[41,48,53,57,60]]];
CH.forEach(([t0,ch])=>{ add(t0,'piano',ch[0],2.2,.22); for(let i=0;i<6;i++){ const n=[ch[1],ch[2],ch[3],ch[4],ch[3],ch[2]][i]; if(t0+i*.4<25.2) add(t0+i*.4,'piano',n,.5,.12); } });
add(12.1,'str',[53,57,60],2.2,.08); add(14.4,'str',[58,62,65],2.4,.07);
[[16.0,72],[16.8,69],[17.6,67],[18.4,65],[19.2,70],[20.0,69],[20.8,67],[21.6,72],[22.4,76],[23.2,74],[24.0,72],[24.6,77]].forEach(([t,m])=>add(t,'piano',m,.9,.26));
add(20.1,'str',[57,60,65],2.4,.1); add(22.5,'str',[60,64,67],2.6,.12);
add(25.2,'str',[46,53,58,62],4.8,.07); [[25.6,74],[26.8,72],[28.0,70]].forEach(([t,m])=>add(t,'piano',m,1.2,.16));
for(let i=0;i<9;i++) add(28.2+i*.11,'pizz',72+(i%3)*2,.2,.18); for(let i=0;i<9;i++) add(29.3+i*.055,'pizz',79-i,.15,.12);
add(30.2,'cym',.25);
const DC=[[41,[57,60,65,69]],[48,[55,60,64,67]],[38,[57,62,65,69]],[46,[58,62,65,70]]];
for(let k=0;k<8;k++){ const tt=30.2+k*.4, [r,ch]=DC[Math.floor(k/2)%4]; if(k%2==0){ add(tt,'pizz',r,.3,.5); add(tt,'drum','kick',.35); } else add(tt,'drum','snare',.16); add(tt,'drum','hihat',.1); ch.forEach(n=>add(tt+.2,'piano',n,.18,.12)); }
[89,93,96].forEach((m,i)=>add(30.25+i*.3,'glock',m,.5,.16));
add(33.2,'str',[50,57,62,65],4,.09); [[33.5,69],[34.7,65],[35.9,62]].forEach(([t,m])=>add(t,'piano',m,1.4,.22));
for(let k=0;k<4;k++) add(33.4+k*1,'drum','hihat',.07,.45);
[41,53,60,67,69,72].forEach((m,i)=>add(37.4+i*.07,'piano',m,4.5,.24-i*.015)); add(37.4,'str',[53,60,65,69],5,.1);
add(38.8,'cel',84,1.2,.2); add(39.8,'cel',81,1.2,.18); add(40.9,'cel',89,1.6,.18);
EV.sort((a,b)=>a.t-b.t);
let ac=null, master=null, BUF=null, noiseBuf=null;
async function loadSamples(c){ if(BUF) return; const B={}; const jobs=[]; for(const [inst,notes] of Object.entries(SAMPLES)) for(const [k,b64] of Object.entries(notes)){ const bin=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)); jobs.push(new Promise(res=>c.decodeAudioData(bin.buffer,buf=>{ (B[inst]??=[]).push({k,buf}); res(); },()=>res()))); } await Promise.all(jobs); BUF=B; }
function impulse(c,sec=3){ const n=c.sampleRate*sec,b=c.createBuffer(2,n,c.sampleRate); for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); } return b; }
function newRun(){ master=ac.createGain(); master.gain.value=.9; const comp=ac.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=2.5; const rev=ac.createConvolver(); rev.buffer=impulse(ac); const wet=ac.createGain(); wet.gain.value=.32; master.connect(comp); master.connect(rev); rev.connect(wet); wet.connect(comp); comp.connect(ac.destination); noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
function killRun(){ if(!master) return; const m=master; m.gain.setTargetAtTime(0,ac.currentTime,.03); setTimeout(()=>{try{m.disconnect()}catch(e){}},400); master=null; }
function nearest(inst,m){ let best=null,d=1e9; for(const s of (BUF[inst]||[])){ const dd=Math.abs(+s.k-m); if(dd<d){ d=dd; best=s; } } return best; }
function smp(inst,t,m,dur,vel,rel=.5,att=.004){ const s=nearest(inst,m); if(!s) return; const src=ac.createBufferSource(); src.buffer=s.buf; src.playbackRate.value=Math.pow(2,(m-(+s.k))/12); const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vel,t+att); g.gain.setValueAtTime(vel,t+Math.max(att,dur)); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(att,dur)+rel); src.connect(g); g.connect(master); src.start(t); src.stop(t+dur+rel+.05); }
const INST={
  piano:(t,m,d,v)=>smp('piano',t,m,d,v,.9),
  str:(t,ns,d,v)=>ns.forEach(m=>smp('string_ensemble_1',t,m,d,v,1.2,.5)),
  pizz:(t,m,d,v)=>smp('pizzicato_strings',t,m,d,v,.3),
  cel:(t,m,d,v)=>smp('celesta',t,m,d,v,1),
  glock:(t,m,d,v)=>smp('glockenspiel',t,m,d,v,.9),
  drum(t,name,v,rate=1){ const s=(BUF.drum||[]).find(x=>x.k===name); if(!s) return; const src=ac.createBufferSource(); src.buffer=s.buf; src.playbackRate.value=rate; const g=ac.createGain(); g.gain.value=v; src.connect(g); g.connect(master); src.start(t); },
  cym(t,v){ const g=ac.createGain(); g.connect(master); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+2.2); const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; hp.connect(g); const n=ac.createBufferSource(); n.buffer=noiseBuf; n.connect(hp); n.start(t); n.stop(t+2.3); },
};

/* ================= PENCIL KIT (refined) ================= */
let seed=1; function rnd(){ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const J=()=>rnd()*2-1;
function dens(p,step=12){ const o=[p[0]]; for(let i=1;i<p.length;i++){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/step)); for(let k=1;k<=n;k++) o.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n]); } return o; }
let G=ctx, LA=1;
function pen(pts,w=2.4,closed=false,a=1){ if(!pts||pts.length<2) return; const p=dens(closed?[...pts,pts[0]]:pts); G.save(); G.lineCap='round'; G.lineJoin='round';
  for(let pass=0;pass<2;pass++){ G.beginPath(); G.strokeStyle=INK; G.globalAlpha=(pass?.22:.8)*a*LA; G.lineWidth=pass?w*.5:w; const o=pass?1.1:0; p.forEach(([x,y],i)=>{ const X=x+J()*.6+o, Y=y+J()*.6-o*.5; i?G.lineTo(X,Y):G.moveTo(X,Y); }); G.stroke(); }
  G.restore(); }
function dot(x,y,r,a=1){ G.save(); G.globalAlpha=.85*a*LA; G.fillStyle=INK; G.beginPath(); G.arc(x,y,r,0,7); G.fill(); G.restore(); }
function ell(cx_,cy,rx,ry,n=28,a0=0,a1=Math.PI*2,rot=0){ const o=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; const x=Math.cos(a)*rx, y=Math.sin(a)*ry; o.push([cx_+x*Math.cos(rot)-y*Math.sin(rot), cy+x*Math.sin(rot)+y*Math.cos(rot)]); } return o; }
function bez(p0,p1,p2,p3,n=16){ const o=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t; o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return o; }
function rect(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function smooth(p,n=6,closed=false){ const P=closed?[p[p.length-1],...p,p[0],p[1]]:[p[0],...p,p[p.length-1]]; const o=[]; for(let i=1;i<P.length-2;i++){ const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2]; for(let k=0;k<n;k++){ const t=k/n,t2=t*t,t3=t2*t; o.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3))); } } if(!closed) o.push(p[p.length-1]); return o; }
function hatchIn(poly,gap=11,a=.3,ang=.8,w=1.2){ if(!poly||poly.length<3) return; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of poly){ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); } G.save(); G.beginPath(); poly.forEach(([x,y],i)=>i?G.lineTo(x,y):G.moveTo(x,y)); G.closePath(); G.clip(); const h=y1-y0; for(let d=-h*ang;d<x1-x0;d+=gap) pen([[x0+d,y1],[x0+d+h*ang,y0]],w,false,a); G.restore(); }
let FX=null, OVR=null;
function fill(pts,col,a=.9,edge=true){ if(!pts||pts.length<3) return; FX.save(); FX.globalAlpha=OVR?1:a; FX.fillStyle=OVR||col; FX.beginPath(); pts.forEach(([x,y],i)=>i?FX.lineTo(x,y):FX.moveTo(x,y)); FX.closePath(); FX.fill(); if(edge&&!OVR){ FX.globalAlpha=.22; FX.strokeStyle=col; FX.lineWidth=5; FX.stroke(); } FX.restore(); }
function fillC(x,y,r,col,a=.9){ FX.save(); FX.globalAlpha=OVR?1:a; FX.fillStyle=OVR||col; FX.beginPath(); FX.arc(x,y,r,0,7); FX.fill(); FX.restore(); }
function glow(x,y,r,col,a=.8){ if(OVR) return; const g=FX.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)'); FX.save(); FX.globalAlpha=a; FX.fillStyle=g; FX.beginPath(); FX.arc(x,y,r,0,7); FX.fill(); FX.restore(); }
function strokeC(pts,col,w,a=.9){ FX.save(); FX.globalAlpha=OVR?1:a; FX.strokeStyle=OVR||col; FX.lineWidth=w; FX.lineCap='round'; FX.lineJoin='round'; FX.beginPath(); pts.forEach(([x,y],i)=>i?FX.lineTo(x,y):FX.moveTo(x,y)); FX.stroke(); FX.restore(); }
function write(text,x,y,size,a=1,progress=1,align='center',rot=0){ const n=Math.floor(text.length*progress); const s=text.slice(0,n); G.save(); G.translate(x,y); G.rotate(rot); G.font=`600 ${size}px "Caveat", cursive`; G.textAlign=align; G.textBaseline='middle'; G.fillStyle=INK; G.globalAlpha=.88*a; G.fillText(s,0,0); G.restore(); }
function textW(text,size){ G.save(); G.font=`600 ${size}px "Caveat", cursive`; const w=G.measureText(text).width; G.restore(); return w; }
function mix(c1,c2,p){ const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16); const r=Math.round(lerp(a>>16,b>>16,p)),g=Math.round(lerp(a>>8&255,b>>8&255,p)),bl=Math.round(lerp(a&255,b&255,p)); return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1); }

/* ================= THE GIRL (rigged) ================= */
const PAL={hair:'#4a3226',hairL:'#7a5640',skin:'#f0c5a3',skinD:'#d9a283',swt:'#d9774e',swtD:'#b4573a',jean:'#a7c1da',jeanD:'#7f9fbe',shoe:'#f7f3ea',lip:'#cf7f72',iris:'#6b7440',silver:'#d9d6cf'};
function ik(a,b,L1,L2,bend){ const dx=b[0]-a[0],dy=b[1]-a[1]; let d=Math.hypot(dx,dy); d=Math.max(1,Math.min(d,L1+L2-.5)); const ang=Math.atan2(dy,dx); const k=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)); const e=ang+bend*k; return [a[0]+Math.cos(e)*L1,a[1]+Math.sin(e)*L1]; }
function nrm(a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1; return [-dy/L,dx/L]; }
function tube(c,ws){ const L=[],R=[]; for(let i=0;i<c.length;i++){ const a=c[Math.max(0,i-1)],b=c[Math.min(c.length-1,i+1)]; const n=nrm(a,b); L.push([c[i][0]+n[0]*ws[i]/2,c[i][1]+n[1]*ws[i]/2]); R.push([c[i][0]-n[0]*ws[i]/2,c[i][1]-n[1]*ws[i]/2]); } return {L,R,poly:[...L,...R.slice().reverse()]}; }
function limb(a,b,c,wa,wb,wc){ const cl=smooth([a,b,c],7); const n=cl.length; const ws=cl.map((_,i)=>{ const u=i/(n-1); return u<.5?lerp(wa,wb,u*2):lerp(wb,wc,(u-.5)*2); }); return {cl,...tube(cl,ws)}; }
const FRK=[[-13,5],[-9,7],[-16,9],[-6,4],[-11,10],[13,5],[9,7],[16,9],[6,4],[11,10],[-2,1],[2,2],[0,4]];
function girl(o,pass,only=-1){
  const want=n=>only<0||only===n;
  const t=o.t||0, s=o.s||1.9, old=o.old||0, P=Object.assign({},PAL,o.pal||{});
  const rot=o.rot||0, piv=o.pivotHip?[o.hipX||0,(o.hipY??-228)]:[0,0];
  const tf=p=>{ const dx=p[0]-piv[0],dy=p[1]-piv[1],c=Math.cos(rot),sn=Math.sin(rot); return [o.x+(dx*c-dy*sn)*s, o.y+(dx*sn+dy*c)*s]; };
  const T=a=>a.map(tf);
  const C=pass==='color', L=pass==='line';
  const F=(pts,col,a=.9,e=true)=>{ if(C) fill(T(pts),col,a,e); };
  const Pn=(pts,w=2.4,cl=false,a=1)=>{ if(L) pen(T(pts),w,cl,a); };
  const hipC=[(o.hipX||0),(o.hipY??-228)+(o.bob||0)];
  const lean=o.lean||0;
  const up=p=>{ const dx=p[0]-hipC[0],dy=p[1]-hipC[1],c=Math.cos(lean),sn=Math.sin(lean); return [hipC[0]+dx*c-dy*sn,hipC[1]+dx*sn+dy*c]; };
  const tilt=(o.tilt||0)+lean, headC=up([hipC[0]+(o.headX||0),hipC[1]-212+(o.headY||0)]);
  const H=(x,y)=>{ const c=Math.cos(tilt),sn=Math.sin(tilt); return [headC[0]+x*c-y*sn,headC[1]+x*sn+y*c]; };
  const HA=a=>a.map(([x,y])=>H(x,y));
  const shL=up([hipC[0]-58,hipC[1]-156]), shR=up([hipC[0]+58,hipC[1]-156]);
  const hipL=[hipC[0]-21,hipC[1]+2], hipR=[hipC[0]+21,hipC[1]+2];
  const hL=o.handL||[hipC[0]-74,hipC[1]+6], hR=o.handR||[hipC[0]+74,hipC[1]+6];
  const eL=ik(shL,hL,94,88,o.bendL??-1), eR=ik(shR,hR,94,88,o.bendR??1);
  const fL=o.footL||[hipC[0]-22,-6], fR=o.footR||[hipC[0]+22,-6];
  const kL=o.kneeLpt||ik(hipL,fL,112,112,o.kneeL??1), kR=o.kneeRpt||ik(hipR,fR,112,112,o.kneeR??-1);
  const hairCol=mix(P.hair,P.silver,old), hairL=mix(P.hairL,'#efece6',old);
  const sw=(o.sway||0), ht=(y)=>Math.max(0,(y-30)/140);
  const swayX=(x,y,ph=0)=>x+sw*ht(y)*16+Math.sin(t*2.2+y*.05+ph)*1.6*ht(y)*(o.flow??1);
  // ---- back hair
  if(want(0)&&o.hairStyle!=='curly'){
    const len=o.hairLen??160;
    const bh=[[-33,-26],[-41,0],[-44,30],[-50,len*.4],[-54,len*.65],[-52,len*.9],[-40,len],[-22,len*.94],[0,len*1.02],[22,len*.94],[40,len],[52,len*.9],[54,len*.65],[50,len*.4],[44,30],[41,0],[33,-26],[18,-40],[0,-43],[-18,-40]].map(([x,y],i)=>[swayX(x,y,i),y]);
    const bp=HA(smooth(bh,4,true)); if(C) fill(bp.map(tf),hairCol,.92); if(L){ pen(bp.map(tf),2.2,true,.8); for(let k=-2;k<=2;k++){ const xs=k*14; pen(HA(smooth([[xs*.6,-10],[xs*.9,len*.3],[xs+Math.sin(t*2+k)*3,len*.6],[xs*1.05,len*.9]].map(([x,y])=>[swayX(x,y,k),y]),5)).map(tf),1.1,false,.45); } }
  }
  // ---- legs
  if(want(1)&&o.legs!==false){
    const legL=limb(hipL,kL,fL,46,36,31), legR=limb(hipR,kR,fR,46,36,31);
    for(const [lg,foot,sd] of [[legL,fL,-1],[legR,fR,1]]){ F(lg.poly,P.jean); if(L){ pen(T(lg.L),2.2); pen(T(lg.R),2.2); pen(T(lg.cl.slice(4,9).map(([x,y])=>[x+sd*4,y])),1,false,.45); hatchIn(T(sd<0?lg.poly.slice(0,lg.L.length):lg.poly),14,.18,.7,1); }
      const sh=[[foot[0]-sd*4-14,foot[1]-8],[foot[0]+sd*18,foot[1]-6],[foot[0]+sd*30,foot[1]+2],[foot[0]+sd*26,foot[1]+10],[foot[0]-sd*14,foot[1]+10],[foot[0]-sd*18,foot[1]]].map(([x,y])=>[x,y]); F(sh,P.shoe,.95); Pn(sh,2.2,true); Pn([[foot[0]-sd*16,foot[1]+6],[foot[0]+sd*28,foot[1]+6]],1.4,false,.6); Pn([[foot[0]+sd*2,foot[1]-6],[foot[0]+sd*10,foot[1]-2]],1.2,false,.6); }
    const hb=[[hipC[0]-44,hipC[1]-14],[hipC[0]+44,hipC[1]-14],[hipC[0]+42,hipC[1]+18],[hipC[0]-42,hipC[1]+18]]; F(hb,P.jean); Pn([[hipC[0],hipC[1]-10],[hipC[0]+2,hipC[1]+30]],1.2,false,.5);
  }

function draw(t){

}
function wrapLines(text,size,maxW){ ctx.font=`italic 500 ${size}px "Lora", Georgia, serif`; const words=text.split(' '), out=[]; let line=''; for(const w of words){ const tt=line?line+' '+w:w; if(ctx.measureText(tt).width>maxW&&line){ out.push(line); line=w; } else line=tt; } out.push(line); return out; }

function captions(t){ const k=cv.width/W; ctx.setTransform(k,0,0,k,0,0); let cur=null; for(const c of CAP) if(c[0]<=t) cur=c; for(const [a,b,s] of (cur?[cur]:[])){ if(t>b+.3) continue; const al=seg(t,a,a+.2)*(1-seg(t,b,b+.3)); const last=a>37; const size=last?66:54; const lines=wrapLines(s,size,900); ctx.save(); ctx.globalAlpha=al; ctx.textAlign='center'; ctx.textBaseline='middle'; const y0=(last?1640:1600);

let playing=false,t0=0,idx=0,timer=null,pos=0,rafOn=false,sleepT=null,started=false;
const big=document.getElementById('big'), btn=document.getElementById('play'), fillEl=document.getElementById('fill');
function now(){ return playing?ac.currentTime-t0:pos; }
function kick(){ if(!rafOn){ rafOn=true; requestAnimationFrame(loop); } }
async function play(from=0){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); clearTimeout(sleepT); await ac.resume(); await loadSamples(ac); killRun(); newRun(); t0=ac.currentTime+.1-from; idx=EV.findIndex(e=>e.t>=from); if(idx<0) idx=EV.length; playing=true; clearInterval(timer); timer=setInterval(tick,40); tick(); big.hidden=true; btn.textContent='stop'; kick(); }
function stop(end){ pos=end?END:now(); playing=false; clearInterval(timer); if(ac){ killRun(); sleepT=setTimeout(()=>{ if(!playing) ac.suspend(); },600); } btn.textContent=end?'again':'play'; if(end){ big.hidden=false; big.textContent='↺'; } kick(); }
function tick(){ const n=now(); if(master){ while(idx<EV.length&&EV[idx].t<n+.25){ const e=EV[idx++]; INST[e.fn](Math.max(ac.currentTime,t0+e.t),...e.a); } } if(n>=END) stop(true); }
big.addEventListener('click',()=>play(0)); btn.addEventListener('click',()=>{ if(playing) stop(false); else play(pos>=END-.1?0:pos); });
function loop(){ const t=playing?now():pos; if(playing) started=true; draw(started?Math.min(t,END-.001):31.4); fillEl.style.width=(clamp(t/END)*100)+'%'; if(playing) requestAnimationFrame(loop); else rafOn=false; }
function resize(){ const r=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.width*dpr*H/W); kick(); }
window.addEventListener('resize',resize); resize();
(document.fonts?Promise.all([document.fonts.load('italic 500 40px "Lora"'),document.fonts.load('600 40px "Caveat"')]):Promise.resolve()).finally(()=>{ big.disabled=false; btn.disabled=false; kick(); });
